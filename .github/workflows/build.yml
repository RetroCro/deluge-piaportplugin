jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 1. Build the egg file
      - name: Build plugin
        run: python setup.py bdist_egg

      # 2. Upload the artifact so you can download it from the GitHub Actions tab
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deluge-plugin-egg
          path: dist/*.egg
